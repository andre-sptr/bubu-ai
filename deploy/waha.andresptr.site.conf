server {
    listen 80 ;
    listen 443 ssl http2 ;
    server_name waha.andresptr.site;
    index index.php index.html index.htm default.php default.htm default.html;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    access_log /www/sites/waha.andresptr.site/log/access.log main;
    error_log /www/sites/waha.andresptr.site/log/error.log;
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    root /www/sites/waha.andresptr.site/index;
    error_page 404 /404.html;
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    ssl_certificate /www/sites/waha.andresptr.site/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/waha.andresptr.site/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    proxy_set_header X-Forwarded-Proto https;
    include /www/sites/waha.andresptr.site/proxy/*.conf;

    location ^~ /assets/ {
        try_files $uri =404;
        include /www/sites/waha.andresptr.site/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(svg|ico|png|webmanifest|txt|js)$ {
        try_files $uri =404;
        include /www/sites/waha.andresptr.site/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /www/sites/waha.andresptr.site/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
}
