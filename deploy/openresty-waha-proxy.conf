# Place inside /opt/1panel/apps/openresty/openresty/www/sites/waha.andresptr.site/proxy/api-backend.conf
# Exposes ONLY the read-only, privacy-sanitized visualizer API and SSE stream.
# Do NOT proxy /webhook on this public domain.
location ^~ /api/visualizer {
    proxy_pass http://127.0.0.1:3088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-cache" always;
    add_header X-Accel-Buffering "no" always;
}
